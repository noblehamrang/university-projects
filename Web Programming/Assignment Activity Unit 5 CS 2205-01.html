<!DOCTYPE html>

<head>

	<meta charset="UTF-8"> <!--Covers all necessary characters-->

	<title>To-Do List</title>

	<style> <!--CSS for buttons and text field-->
		body {
			font-family: Times New Roman, serif;
      			padding: 5px;
			padding-top: 5px;
		}

    		h1 {
      			font-size: 40px;
			margin-top: 5px;
		}

		input[type="text"] {
			padding: 10px;
			width: 400px;
			font-size: 15px;
		}

		button {
			padding: 10px;
			margin-left: 5px;
			font-size: 15px;
			border: none;
			border-radius: 5px;
			cursor: pointer;
		}

		.add-btn {
			background-color: #10b034;
			color: white;
		}

		.edit-btn, .remove-btn {
		margin-left: 10px;
		}

		.edit-btn {
			background-color: #c41a2a;
			color: white;
		}

		.remove-btn {
			background-color: #c41a2a;
			color: white;
		}

		li { <!--List item styling-->
			margin-top: 10px;
		}

		.completed {
			text-decoration: line-through;
			color: grey;
		}

	</style>
</head>

<body>

	<h1>To-Do List</h1>

	<input type="text" id="task" placeholder="Enter a task" /> <!--Creates the text input field for the user to log a task-->
	<button class="add-btn" id="addTask">Add Task</button> <!--Creates the Add Task button for the user to able to add what they entered into the text field-->

	<ul id="taskList"></ul> <!--Creates an unordered list for tasks-->

	<script>
		const task = document.getElementById("task");
		const addTask = document.getElementById("addTask");
		const taskList = document.getElementById("taskList");

		addTask.addEventListener("click", () => { <!--Creates an event listener for the task button so the user can press the button with their mouse-->
			const taskText = task.value.trim();
			if (taskText === "") return; <!--Nothing will be added if the text field is blank-->

			const li = document.createElement("li");
			li.innerHTML = `
				<input type="checkbox" class="toggle" />
				<span class="task-text">${taskText}</span>
				<button class="edit-btn">Edit</button>
				<button class="remove-btn">Remove</button>
			`;

			taskList.append(li); <!--Appends the task list item element (Web Dev Simplified, 2020).-->
			task.value = "";
		});

		taskList.addEventListener("click", (e) => { <!--Event handling for the entire task list including edits, removals, and checks-->
			const li = e.target.closest("li"); <!--Finds which element was clicked-->
			if (!li) return;

			const taskTextSpan = li.querySelector(".task-text");

			if (e.target.classList.contains("edit-btn")) {
				const newTask = prompt("Edit task:", taskTextSpan.textContent);

				if (newTask !== null) {
					taskTextSpan.textContent = newTask.trim();
				}
			}

			if (e.target.classList.contains("remove-btn")) {
				li.remove();
			}

			if (e.target.classList.contains("toggle")) {
				taskTextSpan.classList.toggle("completed", e.target.checked);
			}
		});
	</script>

</body>
</html>
